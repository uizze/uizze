name: Domain Skill Install

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domain-skill-install.yml"
      - "skills/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/domain-skill-install.yml"
      - "skills/**"

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the canonical UIZZE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Install the public UIZZE skills
        working-directory: ${{ runner.temp }}
        run: >-
          npx --yes skills@1.5.20 add https://uizze.com
          --skill '*'
          --agent codex
          --yes
          --copy

      - name: Verify the installed skills
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          for name in anti-ui-slop ui-design ui-radar; do
            skill_dir=".agents/skills/$name"
            skill="$skill_dir/SKILL.md"
            test -s "$skill"
            grep -qx "name: $name" "$skill"
            diff --brief --recursive "$skill_dir" "$GITHUB_WORKSPACE/skills/$name"
          done
