name: Domain Skill Install

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domain-skill-install.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/domain-skill-install.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the canonical UIZZE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the public UIZZE skill
        working-directory: ${{ runner.temp }}
        run: >-
          npx --yes skills@1.5.20 add https://uizze.com
          --skill anti-ui-slop
          --agent codex
          --yes
          --copy
          --metadata '{"source":"uizze-publisher-ci","exclude_from_marketing_metrics":true}'

      - name: Verify the installed skill
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          skill_dir=".agents/skills/anti-ui-slop"
          skill="$skill_dir/SKILL.md"
          test -s "$skill"
          grep -qx 'name: anti-ui-slop' "$skill"
          grep -qx '# Stop Making UI Slop' "$skill"
          grep -Fqx '> **Stop AI coding agents from shipping generic UI.**' "$skill"
          grep -Fq 'anti-ui-slop-skill-banner.png' "$skill"
          grep -Fq 'https://uizze.com' "$skill"
          for required in \
            CHECKSUMS.sha256 \
            MANIFEST.json \
            scripts/context.mjs \
            scripts/detect.mjs \
            scripts/critique-storage.mjs \
            scripts/live-server.mjs; do
            test -s "$skill_dir/$required"
            cmp "$skill_dir/$required" "$GITHUB_WORKSPACE/skills/anti-ui-slop/$required"
          done
          fixture="$(mktemp --suffix=.html)"
          printf '<main><button>Save</button></main>\n' > "$fixture"
          node "$skill_dir/scripts/detect.mjs" --json "$fixture" | jq empty
          rm -f "$fixture"
          if grep -Fq 'github.com' "$skill"; then
            echo "The domain-backed skill must keep uizze.com as its public destination."
            exit 1
          fi
          cmp "$skill" "$GITHUB_WORKSPACE/skills/anti-ui-slop/SKILL.md"
          cmp "$GITHUB_WORKSPACE/skills/anti-ui-slop/SKILL.md" \
            "$GITHUB_WORKSPACE/plugins/claude-directory/skills/anti-ui-slop/SKILL.md"
          cmp "$GITHUB_WORKSPACE/skills/anti-ui-slop/SKILL.md" \
            "$GITHUB_WORKSPACE/plugins/openai-directory/uizze/skills/anti-ui-slop/SKILL.md"
