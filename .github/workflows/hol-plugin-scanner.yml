name: HOL Plugin Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan UIZZE plugin
        uses: hashgraph-online/ai-plugin-scanner-action@55616c962cf86368423f7673b2ecdfdbe613d1af
        with:
          plugin_dir: "plugins/openai-directory/uizze"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
