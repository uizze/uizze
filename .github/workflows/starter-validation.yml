name: Next.js starter validation

on:
  push:
    branches: [main]
    paths:
      - integrations/nextjs-starter/**
      - .github/workflows/starter-validation.yml
  pull_request:
    paths:
      - integrations/nextjs-starter/**
      - .github/workflows/starter-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/nextjs-starter
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: integrations/nextjs-starter/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run validate
