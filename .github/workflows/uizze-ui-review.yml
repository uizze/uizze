name: UIZZE UI Slop Gate

on:
  pull_request:
    paths:
      - "**/*.css"
      - "**/*.html"
      - "**/*.jsx"
      - "**/*.scss"
      - "**/*.svelte"
      - "**/*.tsx"
      - "**/*.vue"

permissions:
  contents: read

jobs:
  ui-finish-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stop UI slop
        uses: uizze/uizze@v1
        with:
          fail-on: error
