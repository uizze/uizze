name: UIZZE UI Slop Gate
description: Catch unfinished UI in pull requests with checks for inert controls, missing state markers, hardcoded colors, and generic dashboard cues.
author: UIZZE

branding:
  icon: eye
  color: blue

inputs:
  files:
    description: Optional comma- or newline-separated paths. By default, the action inspects changed frontend files.
    required: false
    default: ""
  manifest:
    description: Optional path to a local JSON manifest containing files and reviewed-state evidence.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that fails the step; one of error, warning, or never.
    required: false
    default: error
  show-uizze-link:
    description: Link to free UI workflows and optional reference search after scan results. Set false to omit links.
    required: false
    default: "true"
  max-files:
    description: Maximum number of frontend files to inspect.
    required: false
    default: "200"

outputs:
  finding-count:
    description: Number of findings emitted.
  scanned-files:
    description: Number of frontend files inspected.
  conclusion:
    description: pass or fail according to fail-on.

runs:
  using: node24
  main: dist/index.js
